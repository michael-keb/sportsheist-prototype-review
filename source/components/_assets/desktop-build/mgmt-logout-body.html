<!-- =============================== 1 · LOG OUT (dialog over dashboard) -->
<section class="frame" data-title="LogOut">
<div class="content content--flow" style="min-height:1024px;opacity:.35">

  <div class="mghead">
    <h1 class="pagehead__t">Dashboard</h1><span class="mg__club">Barcelona</span>
    <div class="mghead__sp">
      <button class="pill-view pill-view--h"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-mega"/></svg>Announcement</button>
      <button class="cta cta--go cta--head"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>New Proposal</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="kpi__l">Members</div><div class="kpi__v">148</div></div>
    <div class="kpi"><div class="kpi__l">Guests</div><div class="kpi__v">224</div></div>
    <div class="kpi"><div class="kpi__l">Needs Action</div><div class="kpi__v">782</div></div>
  </div>

  <div class="g2">
    <div class="chart" style="min-height:420px">
      <div class="chart__h"><div class="chart__t">Needs Action</div><button class="pill-view" style="margin-left:auto">View all</button></div>
      <div class="bigempty" style="min-height:300px">No items awaiting action</div>
    </div>
    <div class="chart" style="min-height:420px">
      <div class="chart__h"><div class="chart__t">Latest Results</div><button class="pill-view" style="margin-left:auto">View all</button></div>
      <div class="bigempty" style="min-height:300px">No Results published yet</div>
    </div>
  </div>

</div>
<div class="scrim"></div>
<div class="dlg">
  <div class="dlg__badge" style="background:var(--stop-wash);color:var(--stop)"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></div>
  <div class="dlg__t">Log out of Barcelona Management?</div>
  <p class="dlg__p">You&rsquo;ll need your management credentials to sign back in. Drafts of unposted Proposals are kept.</p>
  <button class="cta cta--stop">Log out</button>
  <button class="cta cta--ghost">Cancel</button>
</div>
</section>
